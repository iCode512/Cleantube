<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Core Prices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="../index.html"><img class="logo" src="../images/Corelogo.png" alt="The Core Logo"></a>
            <a href="../index.html">Home</a>
            <a href="Prices.html">Prices</a>
        </nav>
    </header>
    <div class="row">
        <div class="col-sm-4 d-flex flex-column align-items-center">
            <img src="../images/phone.png" width="300" height="300" alt="Phone">
            <p>$1200</p>
        </div>

        <div class="col-sm-4 d-flex flex-column align-items-center">
            <img src="../images/computer.png" width="300" height="300" alt="Computer">
            <p>$3000</p>
        </div>

        <div class="col-sm-4 d-flex flex-column align-items-center">
            <img src="../images/watch.png" width="300" height="300" alt="Watch">
            <p>$280</p>
        </div>
    </div>



    <div class="row">
        <div class="col-sm-4">
            <!-- Img Carousel -->
            <div class="phone-carousel-container">
                <div id="phoneCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#phoneCarousel" data-bs-slide-to="0"
                            class="active"></button>
                        <button type="button" data-bs-target="#phoneCarousel" data-bs-slide-to="1"></button>
                        <button type="button" data-bs-target="#phoneCarousel" data-bs-slide-to="2"></button>
                        <button type="button" data-bs-target="#phoneCarousel" data-bs-slide-to="3"></button>
                        <button type="button" data-bs-target="#phoneCarousel" data-bs-slide-to="4"></button>
                        <button type="button" data-bs-target="#phoneCarousel" data-bs-slide-to="5"></button>
                    </div>

                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="../images/blue-phone.png" class="d-block w-100" alt="Blue phone"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/black-phone.png" class="d-block w-100" alt="Black phone"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/phone.png" class="d-block w-100" alt="Phone"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/green-phone.png" class="d-block w-100" alt="Green phone"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/purple-phone.png" class="d-block w-100" alt="Purple phone"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/white-phone.png" class="d-block w-100" alt="White phone"
                                style="width:300px; height: 350px;">
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#phoneCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#phoneCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <!-- Img Carousel -->
            <div class="computer-carousel-container">
                <div id="compCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#compCarousel" data-bs-slide-to="0"
                            class="active"></button>
                        <button type="button" data-bs-target="#compCarousel" data-bs-slide-to="1"></button>
                        <button type="button" data-bs-target="#compCarousel" data-bs-slide-to="2"></button>
                        <button type="button" data-bs-target="#compCarousel" data-bs-slide-to="3"></button>
                    </div>

                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="../images/computer.png" class="d-block w-100" alt="Computer"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/blackcomputer.png" class="d-block w-100" alt="Black computer"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/graycomputer.png" class="d-block w-100" alt="Gray computer"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/whitecomputer.png" class="d-block w-100" alt="White computer"
                                style="width:300px; height: 350px;">
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#compCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#compCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-sm-4">
            <!-- Img Carousel -->
            <div class="carousel-container">
                <div id="watchCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#watchCarousel" data-bs-slide-to="0"
                            class="active"></button>
                        <button type="button" data-bs-target="#watchCarousel" data-bs-slide-to="1"></button>
                        <button type="button" data-bs-target="#watchCarousel" data-bs-slide-to="2"></button>
                        <button type="button" data-bs-target="#watchCarousel" data-bs-slide-to="3"></button>
                        <button type="button" data-bs-target="#watchCarousel" data-bs-slide-to="4"></button>
                    </div>

                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="../images/blackwatch.png" class="d-block w-100"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/watch.png" class="d-block w-100" style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/goldwatch.png" class="d-block w-100"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/whitewatch.png" class="d-block w-100"
                                style="width:300px; height: 350px;">
                        </div>
                        <div class="carousel-item">
                            <img src="../images/graywatch.png" class="d-block w-100"
                                style="width:300px; height: 350px;">
                        </div>
                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#watchCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#watchCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">Cleantube</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="../index.html">Home</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="chat.html">The Chat</a></li>
                        <li><a class="dropdown-item" href="test_r.html">Test/R</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>


    <main class="posting-container">
        <h1>Create a Post</h1>

        <form id="postForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Enter post title" required>
            </div>

            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" placeholder="Write your post here..." required></textarea>
            </div>

            <button type="submit">Post</button>
        </form>

        <div class="posts" id="posts">
            <h2>Posts</h2>
            <div id="postList"></div>
        </div>
    </main>
    <script>
        const postForm = document.getElementById('postForm');
        const postList = document.getElementById('postList');

        function getPosts() {
            try {
                const posts = JSON.parse(localStorage.getItem('posts') || '[]');
                return Array.isArray(posts) ? posts : [];
            } catch (error) {
                return [];
            }
        }

        function escapeHtml(value) {
            const text = typeof value === 'string' ? value : '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, character => map[character]);
        }

        function loadPosts() {
            postList.innerHTML = '';
            getPosts().forEach(post => {
                const postEl = document.createElement('article');
                postEl.className = 'post';
                postEl.innerHTML = `
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                `;
                postList.appendChild(postEl);
            });
        }

        postForm.addEventListener('submit', event => {
            event.preventDefault();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if (title && content) {
                const posts = getPosts();
                posts.unshift({ title, content, timestamp: new Date().toISOString() });
                localStorage.setItem('posts', JSON.stringify(posts));
                postForm.reset();
                loadPosts();
            }
        });

        loadPosts();
    </script>
</body>

</html>
